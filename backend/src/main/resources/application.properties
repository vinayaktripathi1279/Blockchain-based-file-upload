# ========================================================
# Server Configuration
# ========================================================
server.port=${PORT:8080}

# ========================================================
# Database Configuration (Environment Variables with defaults)
# Supports MySQL via DB_URL=jdbc:mysql://... and falls back to in-memory H2 out-of-the-box!
# ========================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:file_transfer_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ========================================================
# File Upload Configuration
# ========================================================
# Max file size limit: 50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# ========================================================
# Security & JWT Configuration
# ========================================================
# 256-bit secret key for HMAC-SHA256 signature
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 Hours validity (in milliseconds)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ========================================================
# AES-256 File Encryption Key
# Loaded from environment variable; never hardcode production keys!
# A 32-character (256-bit) default key is provided for development
# ========================================================
app.crypto.secret-key=${FILE_ENCRYPTION_KEY:MySecr3t256BitKeyForFileEncryp!}

# ========================================================
# Blockchain (Ethereum/Hardhat) Configuration
# ========================================================
app.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
app.blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
# Hardhat default account #0 private key for signing local transactions
app.blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
app.blockchain.enabled=${BLOCKCHAIN_ENABLED:true}
